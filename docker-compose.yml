services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: martian-ai-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/martian_ai.db
      - PYTHONUNBUFFERED=1
    env_file:
      - backend/.env
    volumes:
      - backend_db:/app/data
      - backend_hf_cache:/home/martian/.cache/huggingface/hub
    networks:
      - martian_network
    restart: unless-stopped
    # NVIDIA GPU passthrough — required for Llama 3.1 8B inference with bitsandbytes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 5 minutes: first launch downloads the Llama 3.1 8B model (~4.5GB)
      start_period: 300s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: martian-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - martian_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  backend_db:
    driver: local
  backend_hf_cache:
    driver: local

networks:
  martian_network:
    driver: bridge
